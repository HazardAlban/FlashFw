<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/creator/creator.css">
    <link rel="stylesheet" href="../css/skinchanger/skinchanger.css">
</head>
<body>
    <div id="creator-container" class="hidden">
        <div class="creator-box">
            <div class="creator-header">
                <h1>Enregistrement</h1>
                <p>Créez votre identité sur le réseau</p>
            </div>

            <form id="creator-form" onsubmit="submitIdentity(event)">
                <div class="input-group">
                    <label for="char-firstname">Prénom</label>
                    <input type="text" id="char-firstname" placeholder="Ex: Jean" required maxlength="20" autocomplete="off">
                </div>

                <div class="input-group">
                    <label for="char-lastname">Nom de famille</label>
                    <input type="text" id="char-lastname" placeholder="Ex: Dupont" required maxlength="20" autocomplete="off">
                </div>

                <div class="input-group">
                    <label for="char-dob">Date de naissance</label>
                    <input type="date" id="char-dob" required min="1940-01-01" max="2010-01-01">
                </div>

                <div class="input-group">
                    <label for="char-nationality">Nationalité</label>
                    <input type="text" id="char-nationality" placeholder="Ex: Américaine" required maxlength="25" autocomplete="off">
                </div>

                <div class="input-group">
                    <label>Sexe</label>
                    <div class="gender-selector">
                        <button type="button" id="gender-m" class="gender-btn active" onclick="setGender('m')">Masculin</button>
                        <button type="button" id="gender-f" class="gender-btn" onclick="setGender('f')">Féminin</button>
                    </div>
                </div>

                <button type="submit" class="btn-submit-identity">
                    Confirmer l'identité <i class="fas fa-id-card"></i>
                </button>
            </form>
        </div>
    </div>


<div id="skinchanger-container" class="hidden">
    <div class="skinchanger-sidebar">
        <div class="skin-header">
            <h1>Créateur</h1>
            <p>Façonnez votre identité visuelle</p>
        </div>

        <div class="skin-tabs">
            <button class="tab-btn active" data-tab="genetic">Génétique</button>
            <button class="tab-btn" data-tab="face">Traits</button>
            <button class="tab-btn" data-tab="style">Apparence</button>
            <button class="tab-btn" data-tab="outfit">Tenue</button>
        </div>

        <div class="skin-content-wrapper" id="dynamic-content">
            </div>

        <button class="btn-save-skin" onclick="saveSkin()">Valider mon personnage</button>
    </div>

    <div class="camera-sidebar">
        <div class="skin-header">
            <h1>Caméra</h1>
            <p>Outils de visualisation</p>
        </div>
        <div class="cam-btn-group">
            <button class="cam-btn" onclick="changeCam('eyes')"><i class="fa-solid fa-eye"></i> Focus Yeux</button>
            <button class="cam-btn" onclick="changeCam('head')"><i class="fa-solid fa-user"></i> Focus Visage</button>
            <button class="cam-btn" onclick="changeCam('torso')"><i class="fa-solid fa-shirt"></i> Focus Torse</button>
            <button class="cam-btn" onclick="changeCam('legs')"><i class="fa-solid fa-socks"></i> Focus Jambes</button>
            <button class="cam-btn" onclick="changeCam('feet')"><i class="fa-solid fa-shoe-prints"></i> Focus Pieds</button>
            
            <p style="color: var(--text-muted); font-size: 10px; text-transform: uppercase; margin: 10px 0 0 0; font-weight: bold; text-align: center;">Zoom</p>
            <div class="cam-row">
                <button class="cam-btn" onclick="zoomCam('in')"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
                <button class="cam-btn" onclick="zoomCam('out')"><i class="fa-solid fa-magnifying-glass-minus"></i></button>
            </div>

            <p style="color: var(--text-muted); font-size: 10px; text-transform: uppercase; margin: 10px 0 0 0; font-weight: bold; text-align: center;">Rotation</p>
            <div class="cam-row">
                <button class="cam-btn" onclick="rotateCam('left')"><i class="fa-solid fa-rotate-left"></i></button>
                <button class="cam-btn" onclick="rotateCam('right')"><i class="fa-solid fa-rotate-right"></i></button>
            </div>
        </div>
    </div>
</div>

    <script src="../js/skinchanger/skinchanger.js"></script>

    <script src="../js/global.js"></script>
    <script src="../js/creator/creator.js"></script>
</body>
</html>
